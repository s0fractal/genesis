<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Ontology 10</title>
    <style>
        :root {
            --glass-bg: rgba(10, 10, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #lens-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 600px;
            
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.05);
            
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translate(-50%, 0px); }
            50% { transform: translate(-50%, -10px); }
            100% { transform: translate(-50%, 0px); }
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-title {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 204, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .semantic-input-group {
            display: flex;
            gap: 10px;
        }

        #semantic-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #semantic-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        #semantic-submit {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.0));
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
            padding: 0 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.85rem;
        }

        #semantic-submit:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
        }

        .stat-value {
            color: #fff;
            font-family: monospace;
            font-size: 0.9rem;
        }

        /* Ambient background glow mapped behind canvas */
        .ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80vw;
            height: 80vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(20,60,50,0.6) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            filter: blur(50px);
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <canvas id="lens-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-header">
            <div class="hud-title">Σ³ Semantic Coupler</div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                OMEGA-64 ACTIVE
            </div>
        </div>
        
        <div class="semantic-input-group">
            <input type="text" id="semantic-input" placeholder="Inject ontological intent..." autocomplete="off">
            <button id="semantic-submit">Project</button>
        </div>

        <div class="stats">
            <div>MUTATION CANDIDATES <span class="stat-value">1024</span></div>
            <div>FPS <span id="fps-counter" class="stat-value">0</span></div>
            <div>OBSERVER <span class="stat-value">WebGPU Lens</span></div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
