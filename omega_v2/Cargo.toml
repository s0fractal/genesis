[package]
name = "omega_v2"
version = "0.1.0"
edition = "2021"
authors = ["Genesis Architect"]
description = "Era 920+ Bare-Metal Phase Lattice Engine (no_std, Zero-Cost Reactivity)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default builds (cdylib for WASM) include the kernel's own panic handler.
# Downstream bare-metal binaries (`omega_spore`) opt OUT to provide
# their own — otherwise rustc complains about a duplicate `panic_impl`
# lang item.
default = ["builtin-panic"]
builtin-panic = []

[dependencies]
# We only use core and alloc, so dependencies must also be no_std
