<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Senate Viewer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg-color: #050508;
        --accent-cyan: #00ffcc;
        --accent-cyan-glow: rgba(0, 255, 204, 0.4);
        --accent-purple: #9d00ff;
        --accent-purple-glow: rgba(157, 0, 255, 0.3);
        --accent-red: #ff3366;
        --accent-green: #33ff66;
        --text-main: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.6);
        --glass-bg: rgba(20, 20, 25, 0.5);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      body, html {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* Ambient Orbs */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        animation: drift 20s infinite alternate ease-in-out;
      }

      .orb-1 {
        width: 500px;
        height: 500px;
        background: var(--accent-cyan-glow);
        top: -100px;
        left: -100px;
      }
      .orb-2 {
        width: 600px;
        height: 600px;
        background: var(--accent-purple-glow);
        bottom: -200px;
        right: -100px;
        animation-delay: -10s;
      }

      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(50px, 50px) scale(1.1);
        }
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 4rem 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 4rem;
      }

      .badge {
        display: inline-block;
        background: rgba(157, 0, 255, 0.1);
        border: 1px solid var(--accent-purple);
        color: var(--accent-purple);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 1rem 0;
        background: linear-gradient(135deg, #ffffff 0%, #a5a5a5 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.subtitle {
        color: var(--text-dim);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
      }

      /* Debate Grid */
      #debate-container {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .proposal-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 2rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 0.3s ease, border-color 0.3s ease;
      }

      .proposal-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .proposal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--glass-border);
      }

      .proposal-title {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.2rem;
        color: var(--accent-cyan);
        margin: 0 0 0.5rem 0;
      }

      .proposal-meta {
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      .status-badge {
        padding: 0.3rem 0.8rem;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
      }

      .status-pending {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .status-ratified {
        background: rgba(51, 255, 102, 0.1);
        color: var(--accent-green);
        border: 1px solid var(--accent-green);
      }
      .status-rejected {
        background: rgba(255, 51, 102, 0.1);
        color: var(--accent-red);
        border: 1px solid var(--accent-red);
      }

      .votes-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .vote-item {
        background: rgba(0, 0, 0, 0.2);
        border-left: 3px solid #fff;
        padding: 1rem;
        border-radius: 0 8px 8px 0;
      }

      .vote-item.aye {
        border-color: var(--accent-green);
      }
      .vote-item.nay {
        border-color: var(--accent-red);
      }

      .vote-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.9rem;
      }

      .oracle-name {
        color: var(--accent-purple);
        font-weight: bold;
      }
      .vote-decision.aye {
        color: var(--accent-green);
      }
      .vote-decision.nay {
        color: var(--accent-red);
      }

      .vote-reasoning {
        color: var(--text-dim);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0;
      }

      .empty-state {
        text-align: center;
        color: var(--text-dim);
        font-style: italic;
        padding: 3rem;
        border: 1px dashed var(--glass-border);
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
      <header>
        <div class="badge">NomosGate Protocol</div>
        <h1>Public Oracle Senate</h1>
        <p class="subtitle">
          Live visualization of autonomous structural consensus and AI Oracle
          debates within the Physical Consensus Substrate.
        </p>
      </header>

      <main id="debate-container">
        <div class="empty-state" id="empty-state">
          Listening for OMEGA-64 network packets... (Awaiting Senate Plasmids)
        </div>
      </main>
    </div>

    <!-- Compile the typescript viewer script -->
    <script type="module" src="./src/ui/senate_viewer.ts"></script>
  </body>
</html>
