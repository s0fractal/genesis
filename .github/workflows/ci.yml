name: Genesis CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.42.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo Formatting
        run: cargo fmt -- --check

      - name: Run Cargo Tests
        run: cargo test --workspace

      - name: Verify Deno Formatting
        run: deno fmt --check

      - name: Run Deno Linter
        run: deno lint

      - name: Run Deno Unit Tests
        run: deno task test:unit
