name: OMEGA-64 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests (omega_core + omega_v2)
        run: cargo test -p omega_core -p omega_v2 --lib

      - name: Check ZK guest compiles
        run: cargo check -p omega_zk_guest

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  deno:
    name: Deno / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno tests
        run: deno test --allow-all tests/
